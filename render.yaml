# Render Blueprint: free Django API. Deploy via Render dashboard -> New -> Blueprint -> this repo.
services:
  - type: web
    name: haulguard-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # SQLite lives on the instance's disk, which is reset on every deploy/restart, so migrate on start.
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /api/rules/
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.2
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Comma-separated frontend origin(s) allowed to call the API.
      - key: CORS_ALLOWED_ORIGINS
        value: https://haulguard-kappa.vercel.app
